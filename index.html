<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4f6fb">
<meta name="format-detection" content="telephone=no">
<title>通知车主挪车</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#eef2fb 0%,#f7f8fc 45%,#eaf1ff 100%);color:#1c2333;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}.card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:28px 22px 22px;box-shadow:0 10px 30px rgba(28,35,51,.08),0 2px 6px rgba(28,35,51,.04)}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700;letter-spacing:.5px}.brand-icon{display:flex;align-items:center}.brand-icon svg{width:28px;height:28px;fill:#1f6feb}.plate{margin-top:16px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#1f6feb,#3b82f6);border-radius:14px;padding:12px 16px;color:#fff}.plate-tag{font-size:12px;opacity:.85;background:rgba(255,255,255,.18);border-radius:6px;padding:3px 8px}.plate-no{font-size:19px;font-weight:700;letter-spacing:2px}.tip{margin-top:12px;margin-bottom:18px;font-size:14px;line-height:1.6;color:#667085}.warn{margin-top:14px;font-size:13px;line-height:1.6;color:#92400e;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 12px}.warn code{background:#feebc8;border-radius:4px;padding:1px 5px;font-size:12px}.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:14px;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s;text-decoration:none}.btn:active{transform:scale(.985)}.btn-primary{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.28)}.btn-primary:hover{background:linear-gradient(135deg,#16a34a,#15803d)}.btn-primary[disabled]{background:#c8cdd8;box-shadow:none;cursor:not-allowed}.btn-ghost{background:#f2f5fb;color:#1f6feb}.btn-ghost:hover{background:#e8eefb}.btn svg{width:20px;height:20px;fill:currentColor}.spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}.is-loading .spinner{display:block}@keyframes spin{to{transform:rotate(360deg)}}.status{margin-top:14px;min-height:20px;font-size:14px;line-height:1.6;text-align:center;color:#667085}.status.ok{color:#15803d}.status.err{color:#dc2626}.foot{margin-top:18px;font-size:12px;color:#98a2b3;text-align:center;line-height:1.6}@media (max-width:360px){.card{padding:22px 16px 18px}}</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg></span><span id="mcTitle">通知车主挪车</span></div>
  <div id="mcPlate"></div>
  <p class="tip" id="mcTip">车辆挡道？点一下按钮，车主会立即收到 Bark 推送</p>
  <div id="mcWarn"></div>
  <button id="btnNotify" class="btn btn-primary" type="button">
    <span class="spinner" aria-hidden="true"></span>
    <span id="btnText">通知车主挪车</span>
  </button>
  <div id="mcCall"></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <p class="foot">通知将以 Bark 推送直达车主手机 · 不会透露您的联系方式</p>
</main>
<script id="mc-cfg" type="application/json">{"title":"通知车主挪车","tip":"车辆挡道？点一下按钮，车主会立即收到 Bark 推送","plate":"","phone":"","phoneDisplay":"","cooldown":60,"ready":false}</script>
<script>(function(){
function el(id){return document.getElementById(id)||{style:{},classList:{add:function(){},remove:function(){}}};}
function esc(s){return String(s==null?"":""+s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":(c==="<"?"&lt;":"&gt;");});}
var cfg={title:"",tip:"",plate:"",phone:"",phoneDisplay:"",cooldown:60,ready:true};
try{var rawEl=document.getElementById("mc-cfg");var raw=JSON.parse((rawEl&&rawEl.textContent)||"{}");for(var k in raw){if(Object.prototype.hasOwnProperty.call(raw,k))cfg[k]=raw[k];}}catch(e){}
var PHONE_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.2 2.4 3.2 4.4 5.6 5.6l2.1-2.1c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.2 1.1l-2.3 2.1z"/></svg>';
var btn=el("btnNotify"),btnText=el("btnText"),statusEl=el("status");
var STORE="mc_notify_until",timer=null,apiState="pending";
function setStatus(t,c){statusEl.textContent=t||"";statusEl.className="status"+(c?" "+c:"");}
function until(){try{return parseInt(localStorage.getItem(STORE)||"0",10);}catch(e){return 0;}}
function lock(sec){try{localStorage.setItem(STORE,String(Date.now()+sec*1000));}catch(e){}startTick();}
function startTick(){
  if(timer){clearInterval(timer);timer=null;}
  var check=function(){
    var left=Math.ceil((until()-Date.now())/1000);
    if(left<=0){if(timer){clearInterval(timer);timer=null;}btn.disabled=false;btn.classList.remove("is-loading");btnText.textContent="通知车主挪车";setStatus("");return false;}
    btn.disabled=true;btnText.textContent="请等待 "+left+" 秒";return true;
  };
  if(check()){timer=setInterval(check,1000);}
}
function render(){
  var t=cfg.title||"通知车主挪车";
  document.title=t;
  el("mcTitle").textContent=t;
  el("mcTip").textContent=cfg.tip||"";
  el("mcPlate").innerHTML=cfg.plate?'<div class="plate"><span class="plate-tag">车辆</span><span class="plate-no">'+esc(cfg.plate)+"</span></div>":"";
  el("mcCall").innerHTML=cfg.phone?'<a class="btn btn-ghost" href="tel:'+esc(cfg.phone)+'">'+PHONE_SVG+"<span>拨打车主电话 "+esc(cfg.phoneDisplay||cfg.phone)+"</span></a>":"";
  var w="";
  if(apiState==="fail"){w='<div class="warn">未检测到服务端接口 <code>/api/config</code>。推送需要随站点一起部署边缘函数（<code>edge-functions/</code> 或 <code>functions/</code> 目录）。</div>';}
  else if(apiState==="ok"&&!cfg.ready){w='<div class="warn">服务端尚未配置 <code>BARK_KEY</code>，推送功能不可用。请在 EdgeOne 控制台「环境变量」中添加后重新部署。</div>';}
  el("mcWarn").innerHTML=w;
}
function applyCfg(d){
  if(typeof d.plate==="string")cfg.plate=d.plate;
  if(d.title)cfg.title=d.title;
  if(d.tip)cfg.tip=d.tip;
  if(d.rawPhone)cfg.phone=d.rawPhone;
  if(d.phone)cfg.phoneDisplay=d.phone;
  if(d.cooldown!==undefined&&d.cooldown!==null)cfg.cooldown=parseInt(d.cooldown,10)||0;
  cfg.ready=d.configured!==false;
}
btn.addEventListener("click",function(){
  if(btn.disabled)return;
  btn.disabled=true;btn.classList.add("is-loading");btnText.textContent="正在发送…";setStatus("");
  fetch("/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})
  .then(function(r){var ct=(r.headers.get("content-type")||"").toLowerCase();if(ct.indexOf("json")<0){var e=new Error("NO_API");e.noapi=true;throw e;}return r.json().then(function(d){return {status:r.status,data:d||{}};});})
  .then(function(res){
    var d=res.data,cd=parseInt(d.cooldown||cfg.cooldown||60,10);
    if(d.ok){setStatus("已通知车主，请稍等片刻","ok");lock(cd);return;}
    btn.classList.remove("is-loading");btn.disabled=false;btnText.textContent="通知车主挪车";
    if(d.code==="COOLDOWN"||d.code==="LIMIT"){setStatus("发送太频繁了，"+(d.retryAfter||60)+" 秒后再试","err");lock(d.retryAfter||cd);}
    else{setStatus("发送失败："+(d.message||("错误 "+(d.code||res.status))),"err");}
  })
  .catch(function(err){btn.classList.remove("is-loading");btn.disabled=false;btnText.textContent="通知车主挪车";setStatus(err&&err.noapi?"推送接口未部署或不可用，请检查边缘函数是否随站点部署":"网络异常，请稍后重试","err");});
});
fetch("/api/config",{headers:{"Accept":"application/json"}})
  .then(function(r){var ct=(r.headers.get("content-type")||"").toLowerCase();if(!r.ok||ct.indexOf("json")<0)throw new Error("NO_API");return r.json();})
  .then(function(d){if(!d||d.ok!==true)throw new Error("BAD");applyCfg(d);apiState="ok";render();})
  .catch(function(){apiState="fail";render();});
render();
startTick();
})();</script>
</body>
</html>
